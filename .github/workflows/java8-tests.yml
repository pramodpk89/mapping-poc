name: Java 8 Windows acceptance
on:
  workflow_dispatch:
jobs:
  windows-java8:
    runs-on: windows-latest
    timeout-minutes: 8
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'
      - name: Configure the provided Java 8 folder
        shell: cmd
        run: echo java.home=%JAVA_HOME%> outputs\copilot-mapping-poc\java-home.properties
      - name: Run shipped JAR and Windows launcher acceptance tests
        shell: cmd
        run: outputs\copilot-mapping-poc\Test-Windows.cmd --output outputs\windows-java8-test-results
      - name: Compile source with a Java 8 compiler
        shell: cmd
        run: |
          mkdir "%RUNNER_TEMP%\mapping-build"
          javac -encoding UTF-8 -d "%RUNNER_TEMP%\mapping-build" outputs\copilot-mapping-poc\.framework\java\Json.java outputs\copilot-mapping-poc\.framework\java\Mapping.java outputs\copilot-mapping-poc\.framework\java\WorkflowTests.java
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-java8-results
          path: outputs/windows-java8-test-results
